name: Release 蒜狸小助手

# Manual release: one version, every platform, one publish.
#
# The version is resolved once so the artifact names, the feed's `version:`, and the installed
# `app.getVersion()` all come from the same release. Each platform only builds; a single publish job
# uploads every target after all of them succeeded, so a failed platform can never leave the others
# pointing at a version that does not exist for it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本（留空则按 harness 版本 + UTC 分钟自动生成）'
        required: false
        type: string
      keep:
        description: '每个平台保留的版本目录数'
        required: false
        default: '2'
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: v
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="$(node scripts/release/aurora-version.mjs)"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publishing $version"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: package:mac:arm64:unsigned
            target: mac-arm64
            artifact: mac-arm64
          - os: windows-latest
            script: package:win:x64:unsigned
            target: win-x64
            artifact: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # Hosted runners start empty, so every Electron, runtime, and electron-builder tool download
      # would hit GitHub again; keep them in one directory the cache below carries between runs.
      - name: Point downloads at the cache
        shell: bash
        run: |
          root="${{ runner.temp }}/suanli-package-cache"
          {
            echo "DSH_DESKTOP_PACKAGE_CACHE_DIR=$root/desktop"
            echo "ELECTRON_BUILDER_CACHE=$root/electron-builder"
            echo "electron_config_cache=$root/electron"
            # GitHub keeps answering 504 for the dmgbuild bundle; electron-builder pins its sha256 and
            # verifies every toolset it fetches, so a mirror cannot substitute the archive.
            if [ "$RUNNER_OS" = macOS ]; then
              echo "ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/"
            fi
          } >> "$GITHUB_ENV"
      - name: Restore the download cache
        id: download-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/suanli-package-cache
          key: suanli-downloads-${{ matrix.target }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/primary-runtime/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            suanli-downloads-${{ matrix.target }}-${{ hashFiles('pnpm-lock.yaml', 'scripts/primary-runtime/**') }}-
            suanli-downloads-${{ matrix.target }}-
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Write the Windows release settings
        if: matrix.target == 'win-x64'
        shell: pwsh
        run: |
          # Unsigned Windows builds still read the release settings file; it also carries the update
          # origin the installed application later polls.
          @"
          DSH_DESKTOP_APP_ID=com.ovaijisuan.jianli.office
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=${{ secrets.R2_PUBLIC_BASE }}
          DOWNLOAD_TEST_RELEASE_ID=0123456789abcdef0123456789abcdef
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=${{ secrets.R2_PUBLIC_BASE }}
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedAuthOrigins":["${{ secrets.R2_PUBLIC_BASE }}"]}
          "@ | Out-File -FilePath apps/desktop/.env.windows -Encoding utf8
      - name: Build the installer
        env:
          # The installed application polls this origin; unsigned builds carry no other update config.
          DSH_BRAND_UPDATE_BASE: ${{ secrets.R2_PUBLIC_BASE }}
        run: pnpm --dir apps/desktop run ${{ matrix.script }} -- --build-version "${{ needs.prepare.outputs.version }}"
      # Every run saves its own entry, even when packaging fails, so a retry reuses whatever already
      # downloaded and a later run picks up tools a partial entry was missing.
      - name: Save the download cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/suanli-package-cache
          key: ${{ steps.download-cache.outputs.cache-primary-key }}
      - name: Prepare the update payload
        if: matrix.target == 'mac-arm64'
        env:
          R2_ACCOUNT_ID: unused
          R2_BUCKET: unused
          R2_PUBLIC_BASE: unused
          R2_ACCESS_KEY_ID: unused
          R2_SECRET_ACCESS_KEY: unused
        run: |
          node scripts/release/aurora-publish.mjs             --artifacts apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts             --version "${{ needs.prepare.outputs.version }}" --feed-only
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.artifact }}
          path: |
            apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/*
            !apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/**/*.app/**
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: artifacts
          merge-multiple: true
      - name: Publish every target
        run: |
          node scripts/release/aurora-publish.mjs             --artifacts artifacts             --version "${{ needs.prepare.outputs.version }}"             --keep "${{ inputs.keep }}"
      - name: Verify both pointers
        run: |
          for target in darwin-arm64:nightly-mac.yml win32-x64:nightly.yml; do
            dir="${target%%:*}"; feed="${target##*:}"
            url="$R2_PUBLIC_BASE/suanli-assistant/$dir/$feed"
            body="$(curl -fsS "$url")"
            echo "$body"
            echo "$body" | grep -q "version: ${{ needs.prepare.outputs.version }}"               || { echo "::error::$url does not name the new version"; exit 1; }
            echo "::notice::$url"
          done
