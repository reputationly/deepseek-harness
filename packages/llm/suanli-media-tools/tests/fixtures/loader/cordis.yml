# Chat image generation over the real catalog and task services, against the canned gateway the
# driver starts; driven by the package's loader.spec.ts. The driver stands in for the profile
# settings service, which needs a profile this fixture does not boot.
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
- id: typert
  name: '@deepseek-ai/dsh-typert-registry'
- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'
- id: storage
  name: '@deepseek-ai/dsh-storage'
- id: storage-json
  name: '@deepseek-ai/dsh-storage-json'
  config:
    root: !!js "process.env.SUANLI_FIXTURE_STORAGE"
- id: storage-domain
  name: '@deepseek-ai/dsh-storage-domain'
  config:
    backend: json
- id: fs
  name: '@deepseek-ai/dsh-fs-local'
- id: session-projections
  name: '@deepseek-ai/dsh-session-projection'
- id: working-directory
  name: '@deepseek-ai/dsh-working-directory'
- id: user-questions
  name: '@deepseek-ai/dsh-user-questions'
- id: tools
  name: '@deepseek-ai/dsh-tools'
- id: tool-executor-native
  name: '@deepseek-ai/dsh-tool-executor-native'
- id: suanli-model-catalog
  name: '@deepseek-ai/dsh-suanli-model-catalog'
  config:
    baseURL: !!js "process.env.SUANLI_FIXTURE_GATEWAY"
    apiKeyEnv: SUANLI_FIXTURE_KEY
- id: suanli-media-tasks
  name: '@deepseek-ai/dsh-suanli-media-tasks'
  config:
    baseURL: !!js "process.env.SUANLI_FIXTURE_GATEWAY"
    apiKeyEnv: SUANLI_FIXTURE_KEY
- id: suanli-media-tools
  name: '@deepseek-ai/dsh-suanli-media-tools'
