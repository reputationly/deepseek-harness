# Replay disables live model requests and preserves the media composition.

- id: llm-deepseek
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: tool-media
  name: '@deepseek-ai/dsh-tool-media'
  disabled: false
  config:
    baseURL: https://maas.ovaijisuan.com/v1
    apiKeyEnv: AURORA_API_KEY
    outputDir: media-output

- id: canvas
  name: '@deepseek-ai/dsh-canvas'
  disabled: false

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                toolUpdate: in-history
              - id: deepseek-v4-pro
          - id: deepseek-messages
            name: DeepSeek Messages
            models:
              - id: deepseek-v4-flash
                toolUpdate: in-history
              - id: deepseek-v4-pro

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true
